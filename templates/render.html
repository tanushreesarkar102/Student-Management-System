<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Python Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #eef2f7; }
        .dashboard { border: 2px solid #0066cc; display: inline-block; padding: 30px; border-radius: 12px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #0066cc; }
        button { background-color: #0066cc; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px;}
        button:hover { background-color: #004499; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Dashboard Interface</h1>
        <p>This layout is clean, organized, and running via an HTML template!</p>
        <button onclick="alert('Python backend integration is functional!')">Test Interactive Button</button>
    </div>
</body>
</html>
